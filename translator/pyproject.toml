[project]
name = "translay-mt"
version = "0.1.0"
description = "Stateful streaming EN→JA translator (PLaMo 3 Translate on MLX) for Translay"
requires-python = "==3.12.*"
dependencies = [
    "coremltools==8.3.0",
    "mlx-lm==0.32.2",
    "mlx-qwen3-asr==0.4.4",
    "mlx-whisper==0.4.3",
    "numba",
    "numpy",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["translay_mt"]

[tool.uv]
# mlx-whisper declares torch, but only its model-conversion module imports it; inference does not.
override-dependencies = ["torch ; sys_platform == 'never'"]
